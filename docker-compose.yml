# Deprecated for production. Use /home/ubuntu/chabaqa/docker-compose.prod.yml
services:
  # ================================
  # Redis Cache Service
  # ================================
  redis:
    image: redis:7-alpine
    container_name: chabaqa-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "chabaqa_redis_2024"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "chabaqa_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chabaqa-network

  # ================================
  # NestJS Backend Service
  # ================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: chabaqa-backend:latest
    container_name: chabaqa-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HTTP_ACCESS_LOG: ${HTTP_ACCESS_LOG:-true}
      # MongoDB Atlas - uses MONGO_URI from .env
      # Redis Configuration
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "chabaqa_redis_2024"
      REDIS_DB: 0
      REDIS_TTL: 300
    volumes:
      - ./uploads:/app/uploads:rw
      - ./public:/app/public:rw
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - chabaqa-network

  # ================================
  # Dozzle (Docker logs + container stats)
  # ================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: chabaqa-dozzle
    restart: always
    ports:
      - "${DOZZLE_PORT:-8088}:8080"
    environment:
      DOZZLE_LEVEL: ${DOZZLE_LEVEL:-info}
      DOZZLE_TAILSIZE: ${DOZZLE_TAILSIZE:-500}
      DOZZLE_FILTER: ${DOZZLE_FILTER:-name=chabaqa-}
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chabaqa-network

networks:
  chabaqa-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
