services:
  # ================================
  # MongoDB Database Service
  # ================================
  mongodb:
    image: mongo:7.0
    container_name: chabaqa-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: chabaqa
    command: ["mongod", "--bind_ip_all", "--auth"]
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - chabaqa-network

  # ================================
  # Redis Cache Service
  # ================================
  redis:
    image: redis:7-alpine
    container_name: chabaqa-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "chabaqa_redis_2024"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - chabaqa-network

  # ================================
  # NestJS Backend Service
  # ================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: chabaqa-backend:latest
    container_name: chabaqa-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGO_URI: "mongodb://admin:admin123@mongodb:27017/chabaqa?authSource=admin&directConnection=true&serverSelectionTimeoutMS=60000&connectTimeoutMS=60000"
      NODE_ENV: production
      PORT: 3000
      SERVER_URL: "http://51.254.132.77:3000"
      NODE_OPTIONS: "--max-old-space-size=2048"
      # Redis Configuration
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "chabaqa_redis_2024"
      REDIS_DB: 0
      REDIS_TTL: 300
    volumes:
      - ./uploads:/app/uploads:rw
      - ./public:/app/public:rw
    depends_on:
      - mongodb
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - chabaqa-network

  # ================================
  # Dozzle - Real-time Log Viewer
  # ================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: always
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300
      DOZZLE_FILTER: "name=chabaqa-backend"
    networks:
      - chabaqa-network

networks:
  chabaqa-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
