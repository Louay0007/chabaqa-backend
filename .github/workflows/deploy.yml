name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ]; then
            echo "Missing secret: VPS_HOST"
            exit 1
          fi
          if [ -z "${VPS_USER:-}" ]; then
            echo "Missing secret: VPS_USER"
            exit 1
          fi
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_KEY_B64:-}" ]; then
            echo "Missing secret: VPS_SSH_KEY or VPS_SSH_KEY_B64"
            exit 1
          fi

      - name: Deploy on VPS (pull + build + restart)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_BACKEND_HEALTH_URL: ${{ secrets.VPS_BACKEND_HEALTH_URL }}
          VPS_REPO_ROOT: ${{ secrets.VPS_REPO_ROOT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          if [ -z "${VPS_PORT:-}" ]; then VPS_PORT=22; fi
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          REPO_ROOT="${VPS_REPO_ROOT:-/home/ubuntu/chabaqa}"
          HEALTH_URL_OVERRIDE="${VPS_BACKEND_HEALTH_URL:-}"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -lc 'set -euo pipefail; REPO_ROOT=\"$REPO_ROOT\"; HEALTH_URL_OVERRIDE=\"$HEALTH_URL_OVERRIDE\"; DEPLOY=\"$REPO_ROOT/scripts/deploy-from-github.sh\"; if [ ! -x \"\$DEPLOY\" ]; then echo \"Missing deploy script on VPS: \$DEPLOY\" >&2; exit 1; fi; \"\$DEPLOY\"; sudo supervisorctl status chabaqa-backend | tee /dev/stderr | grep -q RUNNING; health_url=\"\$HEALTH_URL_OVERRIDE\"; if [ -z \"\$health_url\" ]; then env_file=\"\$REPO_ROOT/.env.prod\"; if [ -f \"\$env_file\" ]; then api_internal_url=\"\$(grep -E \"^API_INTERNAL_URL=\" \"\$env_file\" | tail -n 1 | cut -d= -f2- || true)\"; fi; if [ -n \"\${api_internal_url:-}\" ]; then health_url=\"\${api_internal_url%/}/health\"; else port=\"\$(grep -E \"^PORT=\" \"\$env_file\" 2>/dev/null | tail -n 1 | cut -d= -f2- || true)\"; if [ -z \"\$port\" ]; then port=3000; fi; health_url=\"http://127.0.0.1:\$port/api/health\"; fi; fi; ok=0; for i in {1..30}; do if curl -fsS --max-time 2 \"\$health_url\" >/dev/null; then ok=1; break; fi; sleep 1; done; if [ \"\$ok\" != \"1\" ]; then echo \"Health check failed after 30s: \$health_url\" >&2; sudo supervisorctl tail -200 chabaqa-backend stderr || true; sudo supervisorctl tail -200 chabaqa-backend stdout || true; exit 1; fi'"
