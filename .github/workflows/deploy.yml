name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ]; then
            echo "Missing secret: VPS_HOST"
            exit 1
          fi
          if [ -z "${VPS_USER:-}" ]; then
            echo "Missing secret: VPS_USER"
            exit 1
          fi
          if [ -z "${VPS_SSH_KEY:-}" ] && [ -z "${VPS_SSH_KEY_B64:-}" ]; then
            echo "Missing secret: VPS_SSH_KEY or VPS_SSH_KEY_B64"
            exit 1
          fi

      - name: Deploy on VPS (pull + build + restart)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_BACKEND_HEALTH_URL: ${{ secrets.VPS_BACKEND_HEALTH_URL }}
          VPS_REPO_ROOT: ${{ secrets.VPS_REPO_ROOT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          if [ -z "${VPS_PORT:-}" ]; then VPS_PORT=22; fi
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          REPO_ROOT="${VPS_REPO_ROOT:-/home/ubuntu/chabaqa}"
          HEALTH_URL_OVERRIDE="${VPS_BACKEND_HEALTH_URL:-}"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -lc 'set -euo pipefail; REPO_ROOT=\"$REPO_ROOT\"; HEALTH_URL_OVERRIDE=\"$HEALTH_URL_OVERRIDE\"; DEPLOY_FROM_GH=\"$REPO_ROOT/scripts/deploy-from-github.sh\"; DEPLOY_NATIVE=\"$REPO_ROOT/scripts/deploy-native-apps.sh\"; ENV_FILE=\"$REPO_ROOT/.env.prod\"; BACKEND_REPO=\"$REPO_ROOT/chabaqa-backend\"; if [ ! -x \"\$DEPLOY_FROM_GH\" ]; then echo \"Missing deploy script on VPS: \$DEPLOY_FROM_GH\" >&2; exit 1; fi; if [ ! -x \"\$DEPLOY_NATIVE\" ]; then echo \"Missing deploy script on VPS: \$DEPLOY_NATIVE\" >&2; exit 1; fi; \"\$DEPLOY_FROM_GH\"; echo \"[deploy] VPS backend HEAD: \$(git -C \"\$BACKEND_REPO\" rev-parse --short HEAD) \$(git -C \"\$BACKEND_REPO\" log -1 --pretty=%s)\"; ok_di_fix=0; if [ -f \"\$BACKEND_REPO/src/community-access/community-access.module.ts\" ] && grep -q \"@Global()\" \"\$BACKEND_REPO/src/community-access/community-access.module.ts\"; then ok_di_fix=1; fi; if [ \"\$ok_di_fix\" = \"0\" ] && [ -f \"\$BACKEND_REPO/src/affiliate/affiliate.module.ts\" ] && grep -q \"CommunityAccessModule\" \"\$BACKEND_REPO/src/affiliate/affiliate.module.ts\"; then ok_di_fix=1; fi; if [ \"\$ok_di_fix\" = \"0\" ]; then echo \"[deploy] ERROR: CommunityAccessModule is not global and AffiliateModule does not import it; CommunityPermissionGuard will crash DI.\" >&2; exit 1; fi; if ! getent group loki >/dev/null 2>&1; then sudo groupadd --system loki; fi; if ! id -u loki >/dev/null 2>&1; then sudo useradd --system --no-create-home --shell /usr/sbin/nologin --gid loki loki; fi; sudo mkdir -p /etc/systemd/system/grafana-server.service.d; printf \"[Service]\\nWorkingDirectory=/usr/share/grafana\\n\" | sudo tee /etc/systemd/system/grafana-server.service.d/override.conf >/dev/null; sudo systemctl daemon-reload; sudo systemctl restart grafana-server >/dev/null 2>&1 || true; \"\$DEPLOY_NATIVE\" \"\$ENV_FILE\"; sudo supervisorctl status chabaqa-backend | tee /dev/stderr | grep -q RUNNING; pid=\"\$(sudo supervisorctl pid chabaqa-backend | tr -d \"\\r\\n\" || true)\"; if [ -z \"\$pid\" ] || [ \"\$pid\" = \"0\" ]; then echo \"Unable to determine chabaqa-backend PID\" >&2; exit 1; fi; port=\"\"; if [ -r \"/proc/\$pid/environ\" ]; then port=\"\$(sudo bash -lc \"tr \\\"\\\\0\\\" \\\"\\\\n\\\" </proc/\$pid/environ | grep -E \\\"^PORT=\\\" | tail -n 1 | cut -d= -f2- || true\")\"; fi; if [ -z \"\$port\" ] && [ -f \"\$ENV_FILE\" ]; then port=\"\$(grep -E \"^PORT=\" \"\$ENV_FILE\" | tail -n 1 | cut -d= -f2- || true)\"; fi; if [ -z \"\$port\" ]; then port=3000; fi; api_internal_url=\"\"; if [ -f \"\$ENV_FILE\" ]; then api_internal_url=\"\$(grep -E \"^API_INTERNAL_URL=\" \"\$ENV_FILE\" | tail -n 1 | cut -d= -f2- || true)\"; fi; health_url=\"\$HEALTH_URL_OVERRIDE\"; if [ -z \"\$health_url\" ]; then if [ -n \"\$api_internal_url\" ]; then health_url=\"\${api_internal_url%/}/health\"; else health_url=\"http://127.0.0.1:\$port/api/health\"; fi; fi; echo \"[deploy] backend pid=\$pid port=\$port health_url=\$health_url\"; ok=0; for i in {1..30}; do if curl -fsS --max-time 2 \"\$health_url\" >/dev/null; then ok=1; break; fi; if curl -g -fsS --max-time 2 \"http://[::1]:\$port/api/health\" >/dev/null; then ok=1; health_url=\"http://[::1]:\$port/api/health\"; break; fi; sleep 1; done; if [ \"\$ok\" != \"1\" ]; then echo \"Health check failed after 30s: \$health_url\" >&2; echo \"[deploy] listening sockets (ss)\" >&2; sudo ss -ltnp | grep -E \":\$port\\b\" || true; echo \"[deploy] backend logs (/var/log/backend)\" >&2; sudo ls -la /var/log/backend 2>/dev/null || true; sudo tail -200 /var/log/backend/stderr.log 2>/dev/null || true; sudo tail -200 /var/log/backend/stdout.log 2>/dev/null || true; exit 1; fi'"
