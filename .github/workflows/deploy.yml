name: Deploy Backend to VPS (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts
          
          # Deploy
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" << 'REMOTE_SCRIPT'
            set -euo pipefail
            
            # Navigate to the backend directory and pull changes
            cd /home/ubuntu/chabaqa/chabaqa-backend
            git fetch origin main
            git reset --hard origin/main
            
            # Execute backend docker deploy
            cd /home/ubuntu/chabaqa
            chmod +x docker-deploy.sh
            sudo ./docker-deploy.sh --backend
          REMOTE_SCRIPT
