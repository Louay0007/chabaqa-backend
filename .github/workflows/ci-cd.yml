name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  # ── Stage 1: Lint & Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck || true

  # ── Stage 2: Build ─────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  # ── Stage 3: Test ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test -- --passWithNoTests || true

  # ── Stage 4: Deploy ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/chabaqa/backend
            
            echo "📦 Pulling latest backend code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🔨 Rebuilding backend container..."
            cd /home/ubuntu/chabaqa
            sudo docker compose build --no-cache chabaqa-backend
            
            echo "♻️ Restarting backend..."
            sudo docker compose up -d --force-recreate --no-deps chabaqa-backend
            
            echo "⏳ Waiting for backend health..."
            sleep 15
            
            HEALTH=$(sudo docker inspect --format='{{.State.Health.Status}}' chabaqa-backend 2>/dev/null || echo "unknown")
            if [ "$HEALTH" = "healthy" ]; then
              echo "✅ Backend deployed successfully!"
            else
              echo "⚠️ Health: $HEALTH — checking logs..."
              sudo docker logs chabaqa-backend --tail 20
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Backend API responding (200) — deploy OK"
              else
                echo "❌ Backend not responding ($STATUS)"
                exit 1
              fi
            fi
            
            echo "🧹 Cleaning up old images..."
            sudo docker image prune -f
