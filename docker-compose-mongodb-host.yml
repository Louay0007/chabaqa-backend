version: '3.8'

services:
  # MongoDB with host network mode for direct host access
  mongodb:
    image: mongo:7.0
    container_name: chabaqa-mongodb
    restart: always
    network_mode: "host"  # Use host network to allow direct localhost access
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: chabaqa
    command: ["mongod", "--bind_ip", "127.0.0.1", "--auth", "--port", "27017"]
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ulimits:
      nofile:
        soft: 64000
        hard: 64000

  # Redis with host network mode
  redis:
    image: redis:7-alpine
    container_name: chabaqa-redis
    restart: always
    network_mode: "host"  # Use host network
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "chabaqa_redis_2024"]
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
